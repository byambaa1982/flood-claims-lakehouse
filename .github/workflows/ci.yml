name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests

  dbt:
    runs-on: ubuntu-latest
    env:
      CURATED_BUCKET: placeholder
      ATHENA_RESULTS_BUCKET: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install dbt-core==1.12.7 dbt-athena==1.11.1
      # Parses every model and test without connecting to AWS.
      - run: dbt parse --project-dir dbt --profiles-dir dbt

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff -recursive terraform
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
