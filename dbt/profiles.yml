# No secrets here: AWS credentials come from the environment, and the bucket
# names from `terraform output` through two environment variables.
flood_claims:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: us-east-2
      database: awsdatacatalog
      schema: flood_claims_lakehouse_marts
      work_group: flood-claims-lakehouse
      s3_staging_dir: "s3://{{ env_var('ATHENA_RESULTS_BUCKET') }}/dbt/"
      s3_data_dir: "s3://{{ env_var('CURATED_BUCKET') }}/marts/"
      s3_data_naming: schema_table
      threads: 4
